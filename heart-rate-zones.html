<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心率区间计算器 · 跑道笔记</title>
<meta name="description" content="心率区间计算器：按年龄和静息心率，用最大心率法或 Karvonen 储备心率法算出 Z1-Z5 训练心率区间。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231668dc'/%3E%3Cg stroke='white' stroke-width='4' stroke-linecap='round' fill='none'%3E%3Cpath d='M14 50 L30 18'/%3E%3Cpath d='M27 50 L33 18'/%3E%3Cpath d='M40 50 L36 18'/%3E%3Cpath d='M53 50 L39 18'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* ===== 心率区间计算器样式（蓝白运动风，纯内联） ===== */
:root{
  --blue:#1668dc; --blue-deep:#0a3d8f; --blue-bright:#3d8bfd;
  --blue-soft:#eaf2ff; --ink:#16233b; --muted:#5a6b85;
  --line:#dbe7f7; --bg:#f5f9ff; --white:#fff;
  --radius:14px; --shadow:0 8px 24px rgba(16,60,130,.08);
}
*{ margin:0; padding:0; box-sizing:border-box; }
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.7; -webkit-font-smoothing:antialiased;
}
.container{ max-width:820px; margin:0 auto; padding:0 20px; }

.site-header{ background:linear-gradient(160deg,var(--blue-deep),var(--blue)); color:#fff; padding:26px 0 58px; }
.header-row{ display:flex; align-items:center; gap:12px; }
.header-row svg{ width:36px; height:36px; }
.header-row h1{ font-size:21px; font-weight:800; }
.header-row small{ display:block; font-size:11px; opacity:.8; letter-spacing:2px; }
.header-link{ margin-left:auto; font-size:13.5px; color:#cfe2ff; text-decoration:underline; }

.card{ background:var(--white); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:24px; margin-top:-34px; margin-bottom:20px; }
.card h2{ font-size:17px; font-weight:800; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.card h2::before{ content:""; width:5px; height:18px; border-radius:3px; background:var(--blue); }

/* 输入区 */
.form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:16px; }
.field label{ display:block; font-size:14px; font-weight:600; margin-bottom:6px; }
.unit-input{ position:relative; }
.unit-input span{ position:absolute; right:12px; top:50%; transform:translateY(-50%); font-size:13px; color:var(--muted); pointer-events:none; }
.field input{
  width:100%; height:44px; padding:0 40px 0 12px; font-size:16px; border:1.5px solid var(--line);
  border-radius:10px; background:#fbfdff; outline:none; font-family:inherit;
}
.field input:focus{ border-color:var(--blue); box-shadow:0 0 0 3px rgba(22,104,220,.12); background:#fff; }

/* 算法切换 */
.method{ display:flex; background:var(--blue-soft); border-radius:10px; padding:4px; margin-bottom:16px; }
.method button{
  flex:1; padding:9px; font-size:14px; font-weight:700; border:none; background:none;
  border-radius:7px; color:var(--muted); cursor:pointer; font-family:inherit;
}
.method button.active{ background:#fff; color:var(--blue); box-shadow:0 2px 6px rgba(16,60,130,.12); }

.btn{
  width:100%; height:48px; border:none; border-radius:10px; background:var(--blue);
  color:#fff; font-size:16px; font-weight:700; cursor:pointer; font-family:inherit;
}
.btn:hover{ background:var(--blue-bright); }

/* 结果概览 */
.summary{ display:none; grid-template-columns:1fr 1fr; gap:12px; margin:18px 0; text-align:center; }
.summary.show{ display:grid; }
.summary .box{ background:var(--blue-soft); border-radius:10px; padding:14px 6px; }
.summary .v{ font-size:26px; font-weight:800; color:var(--blue-deep); font-variant-numeric:tabular-nums; }
.summary .l{ font-size:12.5px; color:var(--muted); }

/* 区间表 */
.zones{ display:none; margin-top:8px; }
.zones.show{ display:block; }
.zone{
  display:grid; grid-template-columns:52px 1fr 118px; align-items:center; gap:12px;
  padding:13px 14px; border-radius:10px; margin-bottom:9px;
}
.zone .zname{ font-weight:800; font-size:15px; color:#fff; text-align:center; border-radius:7px; padding:4px 0; }
.zone .zdesc .t{ font-size:14.5px; font-weight:700; }
.zone .zdesc .p{ font-size:12px; color:var(--muted); }
.zone .zbpm{ text-align:right; font-size:15px; font-weight:800; font-variant-numeric:tabular-nums; }
.zone .zbpm small{ display:block; font-size:11px; font-weight:600; color:var(--muted); }

/* 五个区间颜色（由浅到深，蓝色体系，Z5 用红） */
.z1{ background:#eef5ff; } .z1 .zname{ background:#7fb2f0; } .z1 .zbpm{ color:#2f6db5; }
.z2{ background:#e6f0ff; } .z2 .zname{ background:#5594e6; } .z2 .zbpm{ color:#1f5cab; }
.z3{ background:#dcebff; } .z3 .zname{ background:#2f78d8; } .z3 .zbpm{ color:#1550a0; }
.z4{ background:#d2e3ff; } .z4 .zname{ background:#1668dc; } .z4 .zbpm{ color:#0a3d8f; }
.z5{ background:#fdecec; } .z5 .zname{ background:#dc2626; } .z5 .zbpm{ color:#b91c1c; }

.note{ font-size:12.5px; color:var(--muted); margin-top:14px; }
.site-footer{ text-align:center; padding:6px 10px 28px; font-size:12.5px; color:var(--muted); }
@media (max-width:560px){
  .form-grid{ grid-template-columns:1fr; }
  .zone{ grid-template-columns:44px 1fr; }
  .zone .zbpm{ grid-column:2; text-align:left; }
}
@media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-row">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="14" fill="rgba(255,255,255,.16)"/>
      <g stroke="#fff" stroke-width="4" stroke-linecap="round">
        <path d="M14 50 L30 18"/><path d="M27 50 L33 18"/><path d="M40 50 L36 18"/><path d="M53 50 L39 18"/>
      </g>
    </svg>
    <h1>心率区间计算器<small>HEART RATE ZONES</small></h1>
    <a class="header-link" href="index.html">返回首页</a>
  </div>
</header>

<main class="container">
  <section class="card">
    <h2>训练心率区间</h2>

    <div class="form-grid">
      <div class="field">
        <label for="age">年龄</label>
        <div class="unit-input"><input type="number" id="age" min="8" max="80" value="15"><span>岁</span></div>
      </div>
      <div class="field">
        <label for="rhr">静息心率（晨起安静时）</label>
        <div class="unit-input"><input type="number" id="rhr" min="35" max="100" value="65"><span>次/分</span></div>
      </div>
    </div>

    <!-- 算法切换 -->
    <div class="method">
      <button class="active" data-m="karvonen">Karvonen 储备心率法（更准）</button>
      <button data-m="max">最大心率法（简单）</button>
    </div>

    <button class="btn" id="calcBtn">计算我的心率区间</button>

    <!-- 概览 -->
    <div class="summary" id="summary">
      <div class="box"><div class="v" id="vMax">—</div><div class="l">估算最大心率（次/分）</div></div>
      <div class="box"><div class="v" id="vReserve">—</div><div class="l">储备心率（次/分）</div></div>
    </div>

    <!-- 五区间 -->
    <div class="zones" id="zones"></div>

    <p class="note">
      说明：最大心率按经典公式 220 − 年龄估算，个体存在 ±10～15 次误差；
      Karvonen 法用「静息心率 + 储备心率 × 百分比」，对有训练基础的人更贴合。
      心率带 / 手表实测优于公式估算，结果仅供训练参考。
    </p>
  </section>
</main>

<footer class="site-footer">© <span id="year"></span> 跑道笔记 · 心率区间计算器</footer>

<script>
/* ============================================================
   心率区间计算逻辑（原生 JS）
   HRmax = 220 - age；HRR(储备) = HRmax - RHR
   最大心率法：区间 = HRmax × 百分比
   Karvonen：区间 = RHR + HRR × 百分比
   ============================================================ */
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var method = "karvonen";

  // 五个训练区间定义：[下限%, 上限%, 名称, 用途]
  var ZONE_DEF = [
    [0.50, 0.60, "Z1", "热身 / 恢复跑"],
    [0.60, 0.70, "Z2", "有氧基础 / 轻松跑"],
    [0.70, 0.80, "Z3", "有氧耐力 / 节奏跑"],
    [0.80, 0.90, "Z4", "乳酸阈值 / 快跑"],
    [0.90, 1.00, "Z5", "最大摄氧 / 间歇冲刺"]
  ];

  /* ---------- 算法切换 ---------- */
  document.querySelectorAll('.method button').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.method button').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      method = btn.getAttribute('data-m');
    });
  });

  /* ---------- 按百分比算单次 bpm ---------- */
  function bpmAt(pct, hrMax, rhr){
    if(method === "karvonen") return rhr + (hrMax - rhr) * pct;
    return hrMax * pct;
  }

  /* ---------- 计算 ---------- */
  $('calcBtn').addEventListener('click', function(){
    var age = parseInt($('age').value,10);
    var rhr = parseInt($('rhr').value,10);
    if(!(age>=8 && age<=80)){ alert("请填写正确的年龄（8–80）"); return; }
    if(method==="karvonen" && !(rhr>=35 && rhr<=100)){ alert("请填写正确的静息心率（35–100）"); return; }

    var hrMax = 220 - age;
    var reserve = hrMax - rhr;

    $('vMax').textContent = hrMax;
    $('vReserve').textContent = method==="karvonen" ? reserve : "—";
    $('summary').classList.add('show');

    // 逐区间渲染
    var html = "";
    ZONE_DEF.forEach(function(z, i){
      var lo = Math.round(bpmAt(z[0], hrMax, rhr));
      var hi = Math.round(bpmAt(z[1], hrMax, rhr));
      var pctText = Math.round(z[0]*100) + "–" + Math.round(z[1]*100) + "%";
      html +=
        '<div class="zone z'+(i+1)+'">' +
          '<div class="zname">'+z[2]+'</div>' +
          '<div class="zdesc"><div class="t">'+z[3]+'</div><div class="p">'+pctText+' HR'+(method==="karvonen"?"R（储备）":"max")+'</div></div>' +
          '<div class="zbpm">'+lo+'–'+hi+'<small>次 / 分</small></div>' +
        '</div>';
    });
    $('zones').innerHTML = html;
    $('zones').classList.add('show');
  });

  $('year').textContent = new Date().getFullYear();
})();
</script>
</body>
</html>
