        "选鞋底不要过软塌陷，扁平足/高足弓可咨询是否需要足弓支撑。"
      ]
    },
    {

      points:[

        "电解质流失多可能引发抽筋、乏力，但抽筋也与疲劳、强度有关，不能全怪缺水。",

  /* ---------- 渲染分类按钮 ---------- */
  var activeCat = "all";
  var kwInput = $("kw");

  CATS.forEach(function(c){
    var b = document.createElement("button");
    b.textContent = c.name;
    b.setAttribute("data-cat", c.key);
    if(c.key === "all") b.classList.add("on");
    b.addEventListener("click", function(){
      activeCat = c.key;
      document.querySelectorAll("#cats button").forEach(function(x){ x.classList.remove("on"); });
      b.classList.add("on");
      render();
    });
    $("cats").appendChild(b);
  });

  /* ---------- 关键词高亮 ---------- */
  function esc(s){ return s.replace(/[&<>"]/g, function(m){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]; }); }
  function hl(text, q){
    var safe = esc(text);
    if(!q) return safe;
    var qs = q.trim().split(/\s+/).filter(Boolean).map(function(w){ return w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); });
    if(!qs.length) return safe;
    return safe.replace(new RegExp("(" + qs.join("|") + ")", "gi"), "<mark>$1</mark>");
  }

  /* ---------- 渲染结果 ---------- */
  function catName(key){ var n=""; CATS.forEach(function(c){ if(c.key===key) n=c.name; }); return n; }

  function render(){
    var q = kwInput.value.trim();
    var list = DB.filter(function(it){
      if(activeCat !== "all" && it.cat !== activeCat) return false;
      if(!q) return true;
      var hay = (it.title + " " + it.tags.join(" ") + " " + it.points.join(" ")).toLowerCase();
      return q.toLowerCase().split(/\s+/).every(function(w){ return hay.indexOf(w) !== -1; });
    });

    $("meta").textContent = q
      ? ("关键词「" + q + "」找到 " + list.length + " 条相关知识")
      : ("共 " + list.length + " 条知识");

    if(list.length === 0){
      $("results").innerHTML = '<div class="empty"><span class="big">🔍</span>没有找到相关知识<br>试试换个关键词，或切换到「全部」分类</div>';
      return;
    }
    var html = "";
    list.forEach(function(it){
      html += '<article class="k-item">'
        + '<h3><span class="cat-dot">' + catName(it.cat) + '</span>' + hl(it.title, q) + '</h3>'
        + '<div class="tags">' + it.tags.map(function(t){ return "<i>" + hl(t, q) + "</i>"; }).join("") + '</div>'
        + '<ul>' + it.points.map(function(p){ return "<li>" + hl(p, q) + "</li>"; }).join("") + '</ul>'
        + '<div class="one-line">一句话：' + hl(it.line, q) + '</div>'
        + '</article>';
    });
    $("results").innerHTML = html;
  }

  /* ---------- 事件绑定 ---------- */
  kwInput.addEventListener("input", render);
  document.querySelectorAll(".hot button").forEach(function(b){
    b.addEventListener("click", function(){
      kwInput.value = b.getAttribute("data-q");
      activeCat = "all";
      document.querySelectorAll("#cats button").forEach(function(x){ x.classList.toggle("on", x.getAttribute("data-cat")==="all"); });
      render();
      kwInput.focus();
    });
  });

  $("year").textContent = new Date().getFullYear();
  render();
})();
</script>
