<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跑道笔记 - 跑步打卡</title>
    <style>
        *{box-sizing: border-box;margin:0;padding:0;font-family:system-ui}
        body{background:#f3f4f6;max-width:900px;margin:20px auto;padding:0 16px}
        h1{color:#1f2937;margin-bottom:24px;text-align:center}
        .card{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px #00000014;margin-bottom:24px}
        .form-row{margin:12px 0}
        label{display:block;margin-bottom:6px;font-weight:500}
        input,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:16px}
        button{background:#2563eb;color:white;border:none;padding:11px 20px;border-radius:8px;font-size:16px;cursor:pointer}
        button:hover{background:#1d4ed8}
        .record-item{padding:14px;border-bottom:1px solid #eee}
        .record-item:last-child{border-bottom:none}
    </style>
</head>
<body>
    <h1>🏃 跑道笔记 - 跑步打卡记录</h1>

    <div class="card">
        <h3>新增跑步打卡</h3>
        <div class="form-row">
            <label>距离(km)</label>
            <input id="inp_distance" type="number" step="0.01" placeholder="例如 3.2">
        </div>
        <div class="form-row">
            <label>用时(分钟)</label>
            <input id="inp_time" type="text" placeholder="例如 14:20">
        </div>
        <div class="form-row">
            <label>训练日期</label>
            <input id="inp_date" type="date">
        </div>
        <div class="form-row">
            <label>备注</label>
            <textarea id="inp_note" rows="2" placeholder="间歇跑、慢跑恢复等"></textarea>
        </div>
        <button onclick="submitRecord()">提交打卡</button>
    </div>

    <div class="card">
        <h3>全部打卡记录</h3>
        <div id="list_box"></div>
    </div>

<script>
const API_BASE = "";

async function loadList(){
    const resp = await fetch(`${API_BASE}/api/record`);
    const data = await resp.json();
    const box = document.getElementById("list_box");
    box.innerHTML = "";
    if(data.length === 0){
        box.innerHTML = "<div style='padding:12px;color:#666'>暂无打卡记录</div>";
        return;
    }
    data.forEach(item=>{
        const div = document.createElement("div");
        div.className = "record-item";
        div.innerHTML = `
            <div><strong>${item.record_date}</strong> · ${item.distance}km · ${item.time_str}</div>
            <div style="color:#555;margin-top:4px">${item.note || "无备注"}</div>
        `;
        box.appendChild(div);
    })
}

async function submitRecord(){
    const payload = {
        distance: Number(document.getElementById("inp_distance").value),
        time_str: document.getElementById("inp_time").value,
        record_date: document.getElementById("inp_date").value,
        note: document.getElementById("inp_note").value
    }
    await fetch(`${API_BASE}/api/record`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify(payload)
    })
    document.getElementById("inp_distance").value = "";
    document.getElementById("inp_time").value = "";
    document.getElementById("inp_date").value = "";
    document.getElementById("inp_note").value = "";
    loadList();
}

window.onload = loadList;
</script>
</body>
</html>
