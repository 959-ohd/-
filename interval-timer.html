<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>间歇跑计时器 · 跑道笔记</title>
<meta name="description" content="间歇跑计时器：自定义准备、快跑、慢跑时长与组数，自动循环倒计时，分段声音提醒，手机可用。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231668dc'/%3E%3Cg stroke='white' stroke-width='4' stroke-linecap='round' fill='none'%3E%3Cpath d='M14 50 L30 18'/%3E%3Cpath d='M27 50 L33 18'/%3E%3Cpath d='M40 50 L36 18'/%3E%3Cpath d='M53 50 L39 18'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* ===== 间歇跑计时器样式（蓝白运动风，纯内联） ===== */
:root{
  --blue:#1668dc; --blue-deep:#0a3d8f; --blue-bright:#3d8bfd;
  --blue-soft:#eaf2ff; --ink:#16233b; --muted:#5a6b85;
  --line:#dbe7f7; --bg:#f5f9ff; --white:#fff;
  --green:#16a34a; --green-soft:#e8f7ee;
  --amber:#d97706;
  --radius:14px; --shadow:0 8px 24px rgba(16,60,130,.08);
}
*{ margin:0; padding:0; box-sizing:border-box; }
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.7; -webkit-font-smoothing:antialiased;
}
.container{ max-width:880px; margin:0 auto; padding:0 20px; }

.site-header{ background:linear-gradient(160deg,var(--blue-deep),var(--blue)); color:#fff; padding:26px 0 58px; }
.header-row{ display:flex; align-items:center; gap:12px; }
.header-row svg{ width:36px; height:36px; }
.header-row h1{ font-size:21px; font-weight:800; }
.header-row small{ display:block; font-size:11px; opacity:.8; letter-spacing:2px; }
.header-link{ margin-left:auto; font-size:13.5px; color:#cfe2ff; text-decoration:underline; }

/* 布局：设置 + 计时，桌面左右 */
.layout{ display:grid; grid-template-columns:290px 1fr; gap:20px; margin-top:-34px; align-items:start; padding-bottom:40px; }
.card{ background:var(--white); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px; }
.card h2{ font-size:16.5px; font-weight:800; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.card h2::before{ content:""; width:5px; height:18px; border-radius:3px; background:var(--blue); }

.field{ margin-bottom:13px; }
.field label{ display:block; font-size:13.5px; font-weight:600; margin-bottom:5px; }
.field input{
  width:100%; height:42px; padding:0 12px; font-size:16px; border:1.5px solid var(--line);
  border-radius:10px; background:#fbfdff; outline:none; font-family:inherit;
}
.field input:focus{ border-color:var(--blue); box-shadow:0 0 0 3px rgba(22,104,220,.12); background:#fff; }
.field input:disabled{ background:#f0f2f5; color:#999; }
.setting-tip{ font-size:12px; color:var(--muted); margin-top:2px; }

/* 计时卡片 */
.timer-card{ text-align:center; }
.ring-wrap{ position:relative; width:250px; height:250px; margin:6px auto 14px; }
.ring-wrap svg{ width:100%; height:100%; transform:rotate(-90deg); }
.ring-bg{ fill:none; stroke:var(--blue-soft); stroke-width:12; }
.ring-fg{ fill:none; stroke:var(--blue); stroke-width:12; stroke-linecap:round; transition:stroke-dashoffset .12s linear, stroke .3s; }
.ring-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.phase-label{ font-size:14px; font-weight:700; letter-spacing:1px; }
.ring-time{ font-size:46px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.15; }
.ring-set{ font-size:13px; color:var(--muted); }

/* 阶段颜色（同时作用于圆环与标签） */
.st-prep  .ring-fg, .st-prep  .phase-label{ stroke:var(--amber); color:var(--amber); }
.st-run   .ring-fg, .st-run   .phase-label{ stroke:var(--blue); color:var(--blue); }
.st-jog   .ring-fg, .st-jog   .phase-label{ stroke:var(--green); color:var(--green); }
.st-done  .ring-fg, .st-done  .phase-label{ stroke:var(--blue-deep); color:var(--blue-deep); }

.timer-btns{ display:flex; gap:10px; justify-content:center; }
.tbtn{
  padding:11px 26px; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer;
  border:none; font-family:inherit; min-width:110px;
}
.tbtn.primary{ background:var(--blue); color:#fff; }
.tbtn.primary:hover{ background:var(--blue-bright); }
.tbtn.ghost{ background:#fff; color:var(--ink); border:1.5px solid var(--line); }
.tbtn.ghost:hover{ border-color:var(--blue); color:var(--blue); }
.tbtn:disabled{ opacity:.5; cursor:not-allowed; }
.sound-tip{ font-size:12px; color:var(--muted); margin-top:12px; }

/* 图例 */
.legend{ display:flex; justify-content:center; gap:16px; margin-top:14px; font-size:12.5px; color:var(--muted); flex-wrap:wrap; }
.legend i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; }

.site-footer{ text-align:center; padding:6px 10px 28px; font-size:12.5px; color:var(--muted); }
@media (max-width:720px){
  .layout{ grid-template-columns:1fr; }
}
@media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-row">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="14" fill="rgba(255,255,255,.16)"/>
      <g stroke="#fff" stroke-width="4" stroke-linecap="round">
        <path d="M14 50 L30 18"/><path d="M27 50 L33 18"/><path d="M40 50 L36 18"/><path d="M53 50 L39 18"/>
      </g>
    </svg>
    <h1>间歇跑计时器<small>INTERVAL TIMER</small></h1>
    <a class="header-link" href="index.html">返回首页</a>
  </div>
</header>

<main class="container layout">

  <!-- 设置区 -->
  <section class="card">
    <h2>训练设置</h2>
    <div class="field">
      <label for="prep">准备时间（秒）</label>
      <input type="number" id="prep" min="0" max="600" value="10">
    </div>
    <div class="field">
      <label for="run">快跑时长（秒）</label>
      <input type="number" id="run" min="1" max="3600" value="60">
      <p class="setting-tip">例：400m 快跑约 90–110 秒</p>
    </div>
    <div class="field">
      <label for="jog">慢跑 / 休息（秒）</label>
      <input type="number" id="jog" min="1" max="3600" value="60">
    </div>
    <div class="field">
      <label for="sets">总组数</label>
      <input type="number" id="sets" min="1" max="100" value="8">
    </div>
  </section>

  <!-- 计时区 -->
  <section class="card timer-card" id="timerCard">
    <h2 style="justify-content:center">当前训练</h2>

    <div class="ring-wrap">
      <svg viewBox="0 0 200 200">
        <circle class="ring-bg" cx="100" cy="100" r="86"/>
        <!-- 进度圆环：dashoffset 由 JS 计算 -->
        <circle class="ring-fg" id="ringFg" cx="100" cy="100" r="86"
                stroke-dasharray="540.4" stroke-dashoffset="0"/>
      </svg>
      <div class="ring-center">
        <div class="phase-label" id="phaseLabel">待开始</div>
        <div class="ring-time" id="ringTime">00:00</div>
        <div class="ring-set" id="ringSet">设置后点开始</div>
      </div>
    </div>

    <div class="timer-btns">
      <button class="tbtn primary" id="startBtn">开始</button>
      <button class="tbtn ghost" id="resetBtn">重置</button>
    </div>

    <div class="legend">
      <span><i style="background:var(--amber)"></i>准备</span>
      <span><i style="background:var(--blue)"></i>快跑</span>
      <span><i style="background:var(--green)"></i>慢跑</span>
    </div>
    <p class="sound-tip">阶段切换与最后 3 秒有提示音，请保持媒体音量开启。</p>
  </section>
</main>

<footer class="site-footer">© <span id="year"></span> 跑道笔记 · 间歇跑计时器</footer>

<script>
/* ============================================================
   间歇跑计时器逻辑（原生 JS + Web Audio，无外部依赖）
   计时基于时间戳 endAt，避免 setInterval 漂移；
   阶段队列：准备 → (快跑→慢跑)×N（最后一组无慢跑）
   ============================================================ */
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };

  var R = 2*Math.PI*86;                 // 圆环周长（r=86）
  var phases = [];                        // 阶段队列
  var idx = -1;                           // 当前阶段下标
  var endAt = 0;                          // 当前阶段结束时间戳(ms)
  var remainMs = 0;                        // 暂停时剩余
  var timer = null;
  var running = false;
  var audioCtx = null;

  /* ---------- Web Audio 提示音 ---------- */
  function ensureAudio(){
    if(!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  // 单次蜂鸣：freq 频率(Hz)、dur 时长(秒)、delay 延后播放(秒)
  function beep(freq, dur, delay){
    if(!audioCtx) return;
    var t0 = audioCtx.currentTime + (delay||0);
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.6, t0+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }

  /* ---------- 根据设置构建阶段队列 ---------- */
  function buildPhases(){
    var prep = Math.max(0, parseInt($('prep').value,10)||0);
    var run  = Math.max(1, parseInt($('run').value,10)||1);
    var jog  = Math.max(1, parseInt($('jog').value,10)||1);
    var sets = Math.max(1, parseInt($('sets').value,10)||1);
    var list = [];
    if(prep>0) list.push({key:'prep', name:'准备', dur:prep, set:0});
    for(var i=1;i<=sets;i++){
      list.push({key:'run', name:'快跑', dur:run, set:i});
      if(i<sets) list.push({key:'jog', name:'慢跑', dur:jog, set:i});
    }
    return list;
  }

  /* ---------- 渲染 ---------- */
  function fmt(ms){
    var s = Math.max(0, Math.ceil(ms/1000));
    return String(Math.floor(s/60)).padStart(2,'0') + ":" + String(s%60).padStart(2,'0');
  }
  function totalSets(){ return Math.max(1, parseInt($('sets').value,10)||1); }

  function render(ms){
    var p = phases[idx];
    var card = $('timerCard');
    card.className = "card timer-card " + (p ? "st-"+p.key : "");
    if(!p){
      $('phaseLabel').textContent = "待开始";
      $('ringTime').textContent = "00:00";
      $('ringSet').textContent = "设置后点开始";
      $('ringFg').setAttribute('stroke-dashoffset', R);
      return;
    }
    $('phaseLabel').textContent = p.name;
    $('ringTime').textContent = fmt(ms);
    $('ringSet').textContent = p.key==='prep' ? "准备开始" : ("第 " + p.set + " / " + totalSets() + " 组");
    // 圆环进度（剩余比例）
    var ratio = Math.min(1, Math.max(0, ms/(p.dur*1000)));
    $('ringFg').setAttribute('stroke-dashoffset', R*(1-ratio));
  }

  /* ---------- 阶段切换音效 ---------- */
  function enterSound(p){
    if(p.key==='run'){ beep(880,.12,0); beep(880,.12,.18); }
    else if(p.key==='jog'){ beep(523,.18,0); }
    else if(p.key==='prep'){ beep(440,.15,0); }
  }

  /* ---------- tick：每 100ms 检查 ---------- */
  function tick(){
    var ms = endAt - Date.now();
    var p = phases[idx];
    // 最后 3 秒滴答（每秒一次，用 ceil 值变化时）
    if(ms > 0 && ms <= 3000){
      var sec = Math.ceil(ms/1000);
      if(sec !== tick._last){ tick._last = sec; beep(660,.07); }
    }
    if(ms <= 0){
      // 进入下一阶段
      if(idx < phases.length-1){
        idx++;
        var np = phases[idx];
        endAt = Date.now() + np.dur*1000;
        tick._last = null;
        enterSound(np);
        render(np.dur*1000);
      }else{
        finish();
      }
      return;
    }
    render(ms);
  }

  /* ---------- 开始 / 暂停 ---------- */
  $('startBtn').addEventListener('click', function(){
    ensureAudio();
    if(!running){
      if(phases.length === 0){
        phases = buildPhases();
        idx = 0;
        var p0 = phases[0];
        endAt = Date.now() + p0.dur*1000;
        enterSound(p0);
      }else{
        // 从暂停恢复
        endAt = Date.now() + remainMs;
        var cur = phases[idx];
        enterSound(cur);
      }
      running = true;
      $('startBtn').textContent = "暂停";
      setInputsDisabled(true);
      tick._last = null;
      timer = setInterval(tick, 100);
      tick();
    }else{
      // 暂停
      clearInterval(timer);
      remainMs = Math.max(0, endAt - Date.now());
      running = false;
      $('startBtn').textContent = "继续";
    }
  });

  /* ---------- 重置 ---------- */
  $('resetBtn').addEventListener('click', function(){
    clearInterval(timer);
    running = false;
    phases = []; idx = -1; remainMs = 0;
    $('startBtn').textContent = "开始";
    setInputsDisabled(false);
    render(0);
  });

  /* ---------- 完成 ---------- */
  function finish(){
    clearInterval(timer);
    running = false;
    // 完成上行三音
    beep(523,.15,0); beep(659,.15,.16); beep(784,.3,.32);
    $('timerCard').className = "card timer-card st-done";
    $('phaseLabel').textContent = "训练完成";
    $('ringTime').textContent = "00:00";
    $('ringSet').textContent = "共完成 " + totalSets() + " 组，拉伸放松吧";
    $('ringFg').setAttribute('stroke-dashoffset', 0);
    $('startBtn').textContent = "开始";
    setInputsDisabled(false);
    phases = []; idx = -1;
  }

  function setInputsDisabled(d){
    ['prep','run','jog','sets'].forEach(function(id){ $(id).disabled = d; });
  }

  $('year').textContent = new Date().getFullYear();
  render(0);
})();
</script>
</body>
</html>
